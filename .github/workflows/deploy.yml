name: CI & Deploy

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  verify-db:
    name: Verify DB migrate + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathquote
          POSTGRES_PASSWORD: pathquote
          POSTGRES_DB: pathquote
        options: >-
          --health-cmd "pg_isready -U pathquote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://pathquote:pathquote@localhost:5432/pathquote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Migrate
        run: npm run db:migrate

      - name: Seed (first run)
        run: npm run db:seed

      - name: Seed (second run — idempotency check)
        run: npm run db:seed

      - name: Verify seeded row counts
        run: |
          cat > ./.ci-verify-seed.cjs <<'EOF'
          const { PrismaClient } = require("@prisma/client");
          const { PrismaPg } = require("@prisma/adapter-pg");

          const db = new PrismaClient({
            adapter: new PrismaPg({ connectionString: process.env.DATABASE_URL }),
          });

          const expected = { regions: 3, series: 10, products: 67 };

          async function main() {
            const [regions, series, products] = await Promise.all([
              db.region.count(),
              db.series.count(),
              db.product.count(),
            ]);
            const actual = { regions, series, products };
            console.log(`counts: ${JSON.stringify(actual)}`);

            const mismatches = Object.keys(expected).filter(
              (k) => expected[k] !== actual[k]
            );
            if (mismatches.length) {
              console.error(
                `FAIL: mismatch on ${mismatches.join(", ")} (expected ${JSON.stringify(
                  expected
                )}, got ${JSON.stringify(actual)})`
              );
              process.exitCode = 1;
              return;
            }
            console.log("OK: seed counts match expected values");
          }

          main()
            .catch((e) => {
              console.error(e);
              process.exitCode = 1;
            })
            .finally(() => db.$disconnect());
          EOF
          node ./.ci-verify-seed.cjs

  deploy:
    name: Deploy to VPS
    needs: [ci, verify-db]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # WordOps moves sshd off port 22; set VPS_PORT to that port.
          # Falls back to 22 when the secret is unset.
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/pathquote
            git pull --ff-only

            # Build the new images without starting anything yet — the old
            # app container (old schema-compatible code) keeps serving
            # traffic while this happens.
            docker compose build

            # Bring up postgres (if not already) and apply migrations
            # BEFORE the new app code starts. Migrating after `up -d --build`
            # lets the new code run against the old schema for however long
            # the migrate step takes — and if that step fails silently or
            # is misconfigured, it can run against the old schema
            # indefinitely. `docker compose run` exits non-zero on failure
            # and `set -euo pipefail` above stops the deploy right here.
            docker compose up -d postgres
            docker compose run --rm tools npx prisma migrate deploy

            # Only now start/update the app (and gotenberg) — schema is
            # guaranteed to match the code that's about to run.
            docker compose up -d --build

            # Health check: verify both DB connectivity AND schema, with
            # retries for the brief window while the new container boots.
            # A plain `curl -fsS` only proves Postgres answers `SELECT 1`,
            # which succeeds even against a stale schema (see 2026-08-31
            # incident) — schemaOk catches exactly that failure mode.
            ok=false
            for i in $(seq 1 10); do
              response=$(curl -fsS http://127.0.0.1:3010/api/health || true)
              if echo "$response" | grep -q '"ok":true' && echo "$response" | grep -q '"schemaOk":true'; then
                ok=true
                break
              fi
              echo "health check attempt $i failed: ${response:-<no response>}"
              sleep 3
            done
            if [ "$ok" != "true" ]; then
              echo "deploy health check failed after retries"
              docker compose logs --tail=100 app
              exit 1
            fi
            echo "deploy healthy: $response"
