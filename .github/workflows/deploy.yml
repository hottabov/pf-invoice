name: CI & Deploy

"on":
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One job, one `npm ci`. This used to be two jobs (`ci` and `verify-db`),
  # each paying a full install and a Prisma client generation on its own
  # runner. The database half needs nothing the lint/test half doesn't already
  # have except a Postgres service container, which costs seconds.
  ci:
    name: Lint, typecheck, test, verify DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathquote
          POSTGRES_PASSWORD: pathquote
          POSTGRES_DB: pathquote
        options: >-
          --health-cmd "pg_isready -U pathquote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://pathquote:pathquote@localhost:5432/pathquote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, which is `prisma generate` — so a
      # separate generate step here would be the same work twice.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Migrate
        run: npm run db:migrate

      # Catches a schema.prisma edited without a matching migration — the
      # failure mode behind the 2026-08-31 incident. Compares the database the
      # step above just migrated against schema.prisma; an empty diff proves
      # the migrations reproduce the schema exactly. `--exit-code` makes a
      # non-empty diff exit 2, failing the job.
      #
      # Prisma 7 rewrote this command's interface: `--to-schema-datamodel` is
      # now `--to-schema`, and `--shadow-database-url` is gone entirely.
      # Diffing `--from-migrations` would need `datasource.shadowDatabaseUrl`
      # in prisma.config.ts plus a second database; diffing from the live
      # datasource needs neither and checks the applied result rather than a
      # replay of it.
      - name: Migrations reproduce schema.prisma
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Seed (first run)
        run: npm run db:seed

      # The seed is ~4s (measured on the VPS 2026-09-04), so proving
      # idempotency by simply running it twice stays cheap.
      - name: Seed (second run — idempotency check)
        run: npm run db:seed

      # Was a 60-line CommonJS script inlined in this file, which could not
      # import seed-lib.ts and so had to hardcode the region count. Now a tsx
      # script that derives every expected number from the seed's own inputs.
      - name: Verify seeded row counts
        run: npm run db:verify-seed

  # Images are built here, on a 4-vCPU runner with a persistent layer cache,
  # and pushed to GHCR. The VPS used to do this itself on every deploy: a cold
  # `npm ci` (115s) plus `next build`, then a second image export for `tools`
  # (52s export + 17s unpack, measured 2026-09-04), all competing with the
  # live app for CPU. It now only pulls — and a pull is incremental per layer,
  # so the 1.2 GB node_modules layer moves only when package-lock.json changes.
  build:
    name: Build and push images
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `provenance: false` keeps each tag a plain single-platform image
      # rather than a manifest list with an attestation, which is what the VPS
      # wants to pull and what `docker compose` handles most predictably.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}-tools:${{ github.sha }},${{ env.IMAGE }}-tools:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=tools

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        # Set explicitly rather than relying on the runner's default
        # GITHUB_SHA being visible to the action process: `envs` below can
        # only forward what is in this step's environment, and the remote
        # script runs under `set -u`, so a missing value aborts the deploy
        # after the images are already built.
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # WordOps moves sshd off port 22; set VPS_PORT to that port.
          # Falls back to 22 when the secret is unset.
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /opt/pathquote

            # Still needed, but only for docker-compose.yml and .env-adjacent
            # files — never for application code, which now arrives as an image.
            git pull --ff-only

            # Pin both services to this commit's image. docker-compose.yml
            # reads ${TAG}, defaulting to `latest` for a manual `up`.
            export TAG="$GITHUB_SHA"
            echo "deploying $TAG"
            # `tools` sits behind a Compose profile; naming it explicitly is
            # enough for `run`, but `--profile tools` makes `pull` unambiguous.
            docker compose --profile tools pull app tools

            # Bring up postgres (if not already) and apply migrations BEFORE
            # the new app code starts. Migrating after the app is up lets the
            # new code run against the old schema for however long the migrate
            # step takes — and if that step fails silently or is misconfigured,
            # it can run against the old schema indefinitely. `docker compose
            # run` exits non-zero on failure and `set -euo pipefail` above
            # stops the deploy right here.
            docker compose up -d postgres
            docker compose run --rm tools npx prisma migrate deploy

            # Only now start/update the app (and gotenberg) — the schema is
            # guaranteed to match the code that's about to run.
            docker compose up -d app gotenberg

            # Health check: verify both DB connectivity AND schema, with
            # retries for the brief window while the new container boots.
            # A plain `curl -fsS` only proves Postgres answers `SELECT 1`,
            # which succeeds even against a stale schema (see 2026-08-31
            # incident) — schemaOk catches exactly that failure mode.
            ok=false
            for i in $(seq 1 10); do
              response=$(curl -fsS http://127.0.0.1:3010/api/health || true)
              if echo "$response" | grep -q '"ok":true' && echo "$response" | grep -q '"schemaOk":true'; then
                ok=true
                break
              fi
              echo "health check attempt $i failed: ${response:-<no response>}"
              sleep 3
            done
            if [ "$ok" != "true" ]; then
              echo "deploy health check failed after retries"
              docker compose logs --tail=100 app
              echo "to roll back: TAG=<previous sha> docker compose up -d app"
              exit 1
            fi
            echo "deploy healthy: $response"

            # Reclaim the layers the previous tag left behind. Only after the
            # health check passed, so a rollback target survives a failure.
            # `-f` (not `-af`) keeps tagged images, including the previous
            # deploy's, which is exactly what a rollback needs.
            docker image prune -f
