services:
  app:
    build:
      context: .
      target: run
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    volumes:
      - uploads:/data/uploads
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Same uploads volume as `app`: image-import scripts write product photos,
    # option icons and region logos here, and `app` serves them from /api/files.
    # Without this mount the files land inside the throwaway tools container.
    volumes:
      - uploads:/data/uploads
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathquote
      POSTGRES_USER: pathquote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathquote"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
